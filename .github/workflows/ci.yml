name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um commit novo cancela a verificação do anterior no mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owllfloor .
      - name: Sobe o demo e confere se a página responde
        run: |
          docker run -d --name of -p 127.0.0.1:4747:4747 owllfloor
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4747/ > /dev/null && exit 0
            sleep 1
          done
          docker logs of
          exit 1
